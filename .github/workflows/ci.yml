name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install --editable .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate and render examples
        run: |
          python -m pixel_art_skill_toolkit validate examples/slime.json
          python -m pixel_art_skill_toolkit render examples/inventory-panel.json -o preview.png --scale 12
          python -c "from PIL import Image; image=Image.open('preview.png'); assert image.size == (768, 384) and image.mode == 'RGBA'; print(image.size, image.mode)"
